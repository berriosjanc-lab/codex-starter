<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b2d5c" />
  <title>Juan C Berrios | Rooms To Go</title>
  <style>
    :root { --blue:#0b2d5c; --blue2:#164c8c; --light:#f4f7fb; --text:#172033; --muted:#667085; }
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(180deg,#eef4fb 0%,#fff 55%);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:min(430px,100%);background:#fff;border-radius:28px;box-shadow:0 20px 60px rgba(18,38,63,.14);overflow:hidden;border:1px solid #e8edf3}
    .top{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:30px 24px 26px;text-align:center}
    .avatar{width:84px;height:84px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;margin:0 auto 14px;font-weight:800;font-size:28px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
    h1{font-size:28px;margin:0 0 6px}.role{opacity:.92;font-size:15px;margin:0}.company{font-weight:700;margin-top:4px;font-size:17px}
    .body{padding:22px}
    .info{display:grid;gap:12px;margin-bottom:18px}
    .row{background:var(--light);border-radius:16px;padding:14px 16px}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}.value{font-size:16px;font-weight:650;word-break:break-word}
    .actions{display:grid;gap:11px}.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;border-radius:15px;padding:14px 16px;font-weight:750;font-size:16px}.primary{background:var(--blue);color:#fff}.secondary{background:#eef4fb;color:var(--blue);border:1px solid #d8e4f3}.footer{text-align:center;color:var(--muted);font-size:12px;padding:0 22px 22px}
  </style>
</head>
<body>
  <main class="card">
    <section class="top">
      <div class="avatar">JB</div>
      <h1>Juan C Berrios</h1>
      <p class="role">Sales Professional</p>
      <div class="company">Rooms To Go</div>
    </section>
    <section class="body">
      <div class="info">
        <div class="row"><div class="label">Celular</div><div class="value">787-518-4192</div></div>
        <div class="row"><div class="label">Trabajo</div><div class="value">787-653-1999</div></div>
        <div class="row"><div class="label">Email</div><div class="value">berriosjanc@gmail.com</div></div>
      </div>
      <div class="actions">
        <a class="btn primary" href="juan-c-berrios.vcf" download>Guardar contacto</a>
        <a class="btn secondary" href="tel:+17875184192">Llamar al celular</a>
        <a class="btn secondary" href="tel:+17876531999">Llamar a Rooms To Go</a>
        <a class="btn secondary" href="mailto:berriosjanc@gmail.com">Enviar email</a>
      </div>
    </section>
    <div class="footer">Escanea o toca el NFC para guardar mi información de contacto.</div>
  </main>
</body>
</html>
