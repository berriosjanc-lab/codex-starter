<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8b0000">
  <title>Rooms To Go - Vendedor Juan</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:linear-gradient(180deg,#fff1f1,#ffffff);
      color:#2a1a1a;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px
    }
    .card{
      width:min(430px,100%);
      background:#fff;
      border-radius:28px;
      overflow:hidden;
      box-shadow:0 20px 60px rgba(120,20,20,.16);
      border:1px solid #f0d7d7
    }
    .head{
      background:linear-gradient(135deg,#8b0000,#c62828);
      color:#fff;
      text-align:center;
      padding:30px 22px
    }
    .avatar{
      width:86px;
      height:86px;
      border-radius:50%;
      background:#fff;
      color:#8b0000;
      display:grid;
      place-items:center;
      margin:0 auto 14px;
      font-size:30px;
      font-weight:800
    }
    .head h1{margin:0;font-size:28px}
    .head p{margin:6px 0 0;opacity:.95}
    .company{font-weight:800;font-size:18px}
    .body{padding:22px}
    .item{
      background:#fff5f5;
      border-radius:16px;
      padding:14px 16px;
      margin-bottom:10px
    }
    .label{
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.06em;
      color:#8a6666;
      margin-bottom:4px
    }
    .value{
      font-size:16px;
      font-weight:650;
      word-break:break-word
    }
    .btn{
      display:block;
      text-align:center;
      text-decoration:none;
      padding:15px 16px;
      border-radius:15px;
      font-weight:800;
      margin-top:11px
    }
    .primary{
      background:#8b0000;
      color:white
    }
    .secondary{
      background:#fff1f1;
      color:#8b0000;
      border:1px solid #f0d7d7
    }
    .footer{
      text-align:center;
      color:#8a6666;
      font-size:12px;
      padding:0 20px 22px
    }
  </style>
</head>
<body>
  <main class="card">
    <section class="head">
      <div class="avatar">RTG</div>
      <h1>Vendedor Juan</h1>
      <p>Sales Professional</p>
      <p class="company">Rooms To Go</p>
    </section>

    <section class="body">
      <div class="item">
        <div class="label">Celular</div>
        <div class="value">787-518-4192</div>
      </div>

      <div class="item">
        <div class="label">Trabajo</div>
        <div class="value">787-653-1999</div>
      </div>

      <div class="item">
        <div class="label">Email</div>
        <div class="value">berriosjanc@gmail.com</div>
      </div>

      <a class="btn primary" href="juan-c-berrios.vcf">Guardar contacto</a>
      <a class="btn secondary" href="tel:+17875184192">Llamar al celular</a>
      <a class="btn secondary" href="tel:+17876531999">Llamar a Rooms To Go</a>
      <a class="btn secondary" href="mailto:berriosjanc@gmail.com">Enviar email</a>
    </section>

    <div class="footer">Rooms To Go · Vendedor Juan</div>
  </main>
</body>
</html>
